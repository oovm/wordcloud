[package]
name = "wordcloud-wgpu"
version = "0.1.0"
authors = ["Aster <192607617@qq.com>"]
description = "GPU-accelerated word cloud layout via wgpu compute"
repository = "https://github.com/oovm/wordcloud"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"

[dependencies]
wordcloud = { path = "../wordcloud", default-features = false }
wordcloud-types = { path = "../wordcloud-types" }
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }

