[package]
name = "wordcloud"
version = "0.2.0"
authors = ["Aster <192607617@qq.com>"]
description = "Versatile word cloud generator"
repository = "https://github.com/oovm/wordcloud"
readme = "readme.md"
license = "MPL-2.0"
edition = "2021"

[dependencies]
wordcloud-types = { path = "../wordcloud-types" }
rand = { version = "0.8.5", features = ["small_rng"] }
regex = "1.11"

[dependencies.shape-core]
version = "0.1.12"
optional = true

[dependencies.ab_glyph]
version = "0.2.20"
optional = true

[dependencies.image]
version = "0.25.1"
optional = true

[dependencies.rayon]
version = "1.7.0"
optional = true

[dev-dependencies]

[features]
default = ["render"]
render = ["shape-core", "ab_glyph", "image", "rayon"]
