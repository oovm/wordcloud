[package]
name = "wordcloud-wasi"
version = "0.1.0"
authors = ["Aster <192607617@qq.com>"]
description = "WASI Preview 2 component for wordcloud layout and analysis"
license = "MPL-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wordcloud = { path = "../wordcloud", default-features = false }
wordcloud-types = { path = "../wordcloud-types" }
wit-bindgen = "0.41.0"

[package.metadata.component]
package = "doki:land"

[package.metadata.component.target]
path = "wit/world.wit"
world = "wordcloud"
